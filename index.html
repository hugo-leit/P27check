<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P27 Check</title>
<meta name="description" content="P27 Check: constância em hábitos, sem lembretes.">
<meta name="theme-color" content="#1E3A2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="P27 Check">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="P27 Check">
<meta property="og:image" content="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap">
<style>
/* Layout: app de uma tela (cabeçalho, área rolável, abas). Hoje é ação, as outras abas são análise.
   Espaços: 4 8 12 16 20 24 32 · Raios: controles 12/14, botões 16, cards 22, pills 999. */
:root{
  --bg:#F3F5F0; --card:#FFFEFB; --line:#DDE3D9; --line-s:#EAEEE6; --ink:#17261E; --mute:#5E7064;
  --ivy:#1E3A2D; --sage:#7C9885; --sage-d:#587562; --sage-l:#E4EBE1;
  --champ:#E5D9BD; --champ-l:#F3EDDC; --brass:#8A7448; --brass-d:#6B5A2E;
  --wine:#5A2226; --wine-l:#F3E7E5; --ivory:#F8F4E8; --skip:#CAD3C6; --skip-d:#3C5545; --pend:#A9BBAE; --stage:#E3E8DF;
  --st-ok:var(--ivy); --st-min:var(--brass); --st-skip:var(--skip); --st-fail:var(--wine);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-ctl:12px; --r-in:14px; --r-btn:16px; --r-card:22px;
  --serif:"New York", ui-serif, "Playfair Display", Georgia, serif;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;padding:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ivy);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.shell{position:relative;width:100%;max-width:430px;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){
  .stage{padding:var(--s6)}
  .shell{max-height:860px;border-radius:34px;border:1px solid #CBD4C7}
}
/* cabeçalho */
.top{padding:var(--s5) var(--s4) var(--s3);display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3)}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:600}
.lbl{font-size:13px;color:var(--mute);font-weight:600}
h1{margin:2px 0 0;font:500 34px/1.05 var(--serif);color:var(--ivy);text-wrap:balance}
.date{font:italic 400 15px var(--serif);color:var(--sage-d);margin-top:var(--s1)}
.hr{display:flex;align-items:center;gap:var(--s3)}
.prog{display:flex;flex-direction:column;align-items:center;gap:2px}
.ringbox{position:relative;width:52px;height:52px}
.ring{width:52px;height:52px;display:block}
.rt{fill:none;stroke:var(--sage-l);stroke-width:3}
.rf{fill:none;stroke:var(--ivy);stroke-width:3;stroke-linecap:round}
.pn{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:15px;line-height:1}
.pn b{font:500 21px/1 var(--serif);color:var(--ivy);font-variant-numeric:tabular-nums}
.pn small{font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums}
.pl{font-size:10.5px;color:var(--mute)}
.trophy{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ivy);padding:0;flex:none}
.trophy svg{width:20px;height:20px}
.trophy.glow{border-color:var(--brass);color:var(--brass-d);animation:glow 1.8s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(138,116,72,.35)}100%{box-shadow:0 0 0 10px rgba(138,116,72,0)}}
.tbadge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--brass);color:#fff;font:700 11px var(--sans);display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.count{font:500 30px/1 var(--serif);color:var(--ivy);font-variant-numeric:tabular-nums;text-align:right}
/* área rolável */
#view{flex:1;min-height:0;overflow-y:auto;padding:var(--s1) var(--s4) var(--s6);display:flex;flex-direction:column;gap:var(--s5);-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s4)}
.sec{display:flex;flex-direction:column;gap:var(--s2)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);padding:0 var(--s1)}
.sh.tg{width:100%;border:0;background:transparent;text-align:left;font-family:inherit;min-height:44px;align-items:center;cursor:pointer;color:inherit}
.sh.tg .chev{width:16px;height:16px;color:var(--mute);transition:transform .18s ease;flex:none}
.sh.tg[aria-expanded=true] .chev{transform:rotate(90deg)}
.sh.tg .cnt{margin-left:auto}
.psum{font-size:12.5px;color:var(--mute);padding:0 var(--s1);margin-top:calc(var(--s2) * -1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input::placeholder,textarea::placeholder{color:#66786D;opacity:1}
.sh h2{margin:0;font:500 20px/1.2 var(--serif);color:var(--ivy)}
.cnt{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.cnt.win{color:var(--brass-d);font-weight:600}
.pbar{height:4px;border-radius:2px;background:var(--sage-l);overflow:hidden;margin:0 var(--s1)}
.pbar i{display:block;height:100%;border-radius:2px;background:var(--ivy)}
.pbar.sm{height:6px;margin:var(--s2) 0 0;border-radius:3px}
.pbar.sm i{background:var(--sage)}
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.hint{font-size:12px;color:var(--mute);text-align:center;transition:opacity .2s}.hint.dim{opacity:.55}
.sub{font-size:12.5px;color:var(--mute)}
.note-f{font-size:13px;color:var(--mute);text-align:center;background:var(--champ-l);border-radius:var(--r-in);padding:var(--s3)}
/* semana compacta */
.wk{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;gap:var(--s1)}
.arr{width:28px;height:44px;border:0;background:transparent;color:var(--mute);display:grid;place-items:center;padding:0}
.arr svg{width:16px;height:16px}
.arr:disabled{opacity:.3}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1)}
.dchip{border:1px solid var(--line);background:var(--card);border-radius:var(--r-in);min-height:52px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;color:var(--ink)}
.dchip small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.dchip b{font:500 17px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.dchip i{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:2px}
.dchip i.v{background:var(--ivy)}.dchip i.a{background:var(--sage)}.dchip i.f{background:var(--wine)}.dchip i.miss{background:var(--brass)}.dchip i.x{background:var(--skip)}
.dchip.tod:not(.sel){border:2px solid var(--ivy);padding-top:5px}
.dchip.sel{background:var(--ivy);border-color:var(--ivy);color:var(--ivory)}
.dchip.sel small{color:rgba(248,244,232,.75)}
.dchip.sel i.v{background:var(--champ)}.dchip.sel i.a{background:#B8CDBE}.dchip.sel i.f{background:#E7B9B6}.dchip.sel i.miss{background:var(--champ)}
.dchip:disabled{opacity:.35}
.back{display:flex;justify-content:center;margin-top:calc(var(--s2) * -1)}
.tlink{border:1px solid var(--line);background:var(--card);color:var(--ivy);font-size:13px;font-weight:600;padding:0 var(--s4);min-height:36px;border-radius:999px}
/* hábitos */
.hrow{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s2) var(--s2) var(--s3);min-height:60px}
.hrow+.hrow{border-top:1px solid var(--line-s)}
.hrow.pop{animation:rowpop .2s ease-out}
@keyframes rowpop{0%{transform:scale(1)}40%{transform:scale(.992)}100%{transform:scale(1)}}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--pend);background:var(--card);display:grid;place-items:center;flex:none;padding:0;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .12s}
.chk:active:not(:disabled){transform:scale(.94)}
.chk:disabled{opacity:.55}
.chk svg{width:22px;height:22px}
.s-ok{background:var(--st-ok);border-color:var(--st-ok)}
.s-min{background:var(--st-min);border-color:var(--st-min)}
.s-skip{background:var(--st-skip);border-color:var(--st-skip)}
.s-fail{background:var(--st-fail);border-color:var(--st-fail)}
.chk.pop{animation:chkbg .18s ease-out,chkpop .22s ease-out}
.chk.pop svg path{stroke-dasharray:32;animation:draw .2s ease-out .03s backwards}
@keyframes chkbg{from{background-color:var(--card);border-color:var(--pend)}}
@keyframes chkpop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:32}to{stroke-dashoffset:0}}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hname{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;line-height:1.25}
.hrow.done .hname{color:var(--mute)}
.hsub{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:500;border-radius:8px;padding:1px 7px;border:0;background:rgba(90,34,38,.07);color:var(--wine);line-height:1.5;white-space:nowrap}
.tag.soft{border-color:var(--brass);color:var(--brass-d)}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;border:1px solid var(--ivy);color:var(--ivy);line-height:1.5}
.pill.st{border:0;background:var(--sage-l)}
.more{width:44px;height:44px;border:0;background:transparent;border-radius:var(--r-ctl);color:var(--mute);flex:none;display:grid;place-items:center;padding:0}
.more svg{width:20px;height:20px}
.more:disabled{opacity:.3}
/* pendências */
.alert+.alert{border-top:1px solid var(--line-s)}
.ahead{width:100%;display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);border:0;background:transparent;text-align:left;min-height:56px}
.adot{width:8px;height:8px;border-radius:50%;background:var(--wine);flex:none}
.adot.y{background:var(--brass)}
.at{flex:1;min-width:0}
.at b{display:block;font-size:15px;font-weight:600}
.at small{display:block;font-size:12.5px;color:var(--mute)}
.chev{width:16px;height:16px;color:var(--mute);flex:none;transition:transform .15s}
.alert.open .chev{transform:rotate(90deg)}
.abody{padding:0 var(--s4) var(--s4) calc(var(--s4) + 8px + var(--s3));display:flex;flex-direction:column;gap:var(--s3)}
.abody p{margin:0;font:400 15px/1.4 var(--serif);color:var(--ink)}
.abody .btn{align-self:flex-start}
.note{display:flex;gap:var(--s2)}
.note input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:var(--r-in);background:var(--card);padding:0 var(--s3);font:inherit;font-size:16px;color:var(--ink)}
.saved{font-size:13px;color:var(--mute);font-style:italic}
.btn{border:0;border-radius:var(--r-btn);background:var(--champ);color:var(--ivy);font-weight:600;padding:var(--s3) var(--s4);min-height:44px}
.btn.alt{background:var(--card);border:1px solid var(--line)}
.btn.danger{background:var(--wine);color:var(--ivory)}
.btn.full{width:100%}
/* progresso e peso na home */
.pstats,.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s4) 0}
.stats{background:var(--card)}
.stat{padding:0 var(--s3);min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:500 26px/1 var(--serif);color:var(--ivy);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11.5px;color:var(--mute);margin-top:var(--s2);line-height:1.25}
.quick{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);width:100%;min-height:56px;padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r-card);background:var(--card);text-align:left}
.quick b{font-weight:600;font-size:15px}
.qv{display:flex;align-items:center;gap:var(--s2);color:var(--mute);font-size:14px}
.qv strong{font:500 21px var(--serif);color:var(--ivy);font-variant-numeric:tabular-nums}
.qv svg{width:16px;height:16px}
.next{font-size:13px;color:var(--sage-d);padding:0 var(--s1);line-height:1.5;text-wrap:pretty}
.next b{color:var(--ivy);font:600 15px var(--serif)}
/* semana */
.wknav{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.wknav span{font:500 17px var(--serif);color:var(--ivy);text-align:center;flex:1}
.navb{position:relative;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 var(--s3);font-size:12.5px;font-weight:600;color:var(--ivy);min-height:34px}
.navb::after{content:'';position:absolute;left:-4px;right:-4px;top:-5px;bottom:-5px}
.navb:disabled{opacity:.35}
.navb.danger{color:var(--wine);border-color:#DCC7C4}
.big{display:flex;align-items:baseline;gap:var(--s3)}
.big b{font:500 52px/1 var(--serif);color:var(--ivy);font-variant-numeric:tabular-nums}
.big span{font-size:13px;color:var(--mute)}
.track{position:relative;height:10px;border-radius:5px;background:var(--sage-l);margin:var(--s4) 0 var(--s2)}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--ivy)}
.track .fill.low{background:var(--sage)}
.track .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);left:80%}
.tl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute)}
.gridwrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,22px) 36px;gap:6px 2px;align-items:center}
.gh{border:0;background:transparent;padding:0;font-family:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center;font-weight:600;line-height:1.2;min-height:36px}
button.gh{cursor:pointer}
.gh.today{color:var(--ivy)}
.gh em{display:block;font:500 13px var(--serif);font-style:normal;letter-spacing:0;color:var(--ink);margin-top:1px}
.gname{font-size:12.5px;font-weight:500;line-height:1.2}
.cell{width:22px;height:22px;border-radius:8px;display:grid;place-items:center}
.cell svg{width:13px;height:13px}
.cell.none{color:#B9C4B8;font-size:14px}
.cell.pend{border:1.5px dashed var(--pend);background:var(--card)}
.cell.pendt{border:2px solid var(--ivy);background:var(--card)}
.cell.bonus{border:1.5px dashed var(--champ);color:var(--brass)}
.cell.bonus b{font:italic 600 12px/1 var(--serif);color:var(--brass-d)}
.cell.fut{border:1.5px dashed #DDE4DA}
.pct{font-size:12px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.pct.good{color:var(--ivy);font-weight:600}
.pct.bad{color:var(--wine);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:12px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.legend i.bn{border:1.5px dashed var(--champ);display:inline-grid;place-items:center;font:italic 600 9px/1 var(--serif);color:var(--brass-d)}
.sat{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.sat b{font:500 26px var(--serif);color:var(--ivy)}
.sat p{margin:0;font-size:13px;color:var(--mute)}
/* histórico */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.mnav h2{margin:0;font:500 24px var(--serif);color:var(--ivy)}
.mnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.mnav button:disabled{opacity:.35}
.mnav svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:center;font-weight:600;padding-bottom:2px}
.d{aspect-ratio:1;border-radius:var(--r-ctl);display:flex;align-items:flex-start;justify-content:flex-start;padding:6px 7px;font-size:12px;font-variant-numeric:tabular-nums;min-width:0;border:0;font-family:inherit;text-align:left}
button.d{cursor:pointer}
.d.v{background:var(--ivy);color:var(--ivory)}
.d.a{background:var(--sage);color:#fff}
.d.f{background:var(--wine);color:var(--ivory)}
.d.x{background:repeating-linear-gradient(135deg,#D6DDD2 0 5px,#E6EBE2 5px 10px);color:var(--mute)}
.d.miss{background:var(--champ-l);border:1.5px dashed var(--champ);color:var(--brass-d)}
.d.pend{background:var(--card);color:var(--ivy);font-weight:700}
.d.fut{border:1.5px dashed #D3DBCF;color:#9DAB9F}
.d.blank{visibility:hidden}
.d.cur-ring{outline:1.5px solid var(--ivy);outline-offset:2px}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);padding:var(--s4) 0}
.legend.sm{gap:6px var(--s3);font-size:11.5px}
.legend.sm i{width:10px;height:10px;border-radius:3px}
/* peso */
.wform{display:flex;flex-direction:column;gap:var(--s3)}
.wfields{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3)}
.wfields input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;text-align:left;line-height:48px}
.wfields input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
.fl{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mute);font-weight:600;min-width:0}
.fl input{height:48px;border:1px solid var(--line);border-radius:var(--r-in);background:var(--card);padding:0 var(--s3);font:500 16px var(--sans);color:var(--ink);width:100%;min-width:0}
.wfields input#w-kg{height:56px;font:500 28px var(--serif);color:var(--ivy)}
.wfields input#w-date{height:56px}
.werr{font-size:13px;color:var(--wine)}
.werr:empty{display:none}
.chart{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mute);font:10px var(--sans)}
.ln{fill:none;stroke:var(--ivy);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--ivy);fill-opacity:.08;stroke:none}
.pt{fill:var(--card);stroke:var(--ivy);stroke-width:2}
.pt.last{fill:var(--ivy)}
.halo{fill:var(--ivy);fill-opacity:.15}
.vl{fill:var(--ivy);font:600 12px var(--serif)}
.lh{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);margin-bottom:var(--s1)}
.lh h2{margin:0;font:500 20px var(--serif);color:var(--ivy)}
.wrow{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) 0 var(--s1) 0;border-top:1px solid var(--line-s);min-height:56px}
.wrow.first{border-top:0}
.wd1{flex:1;min-width:0}
.wd1 b{display:block;font-weight:600;font-size:15px}
.wd1 span{font-size:12px;color:var(--mute)}
.wkg{font:500 22px var(--serif);color:var(--ivy);font-variant-numeric:tabular-nums}

<script>
(function(){
var DAYS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
var WDLONG=['segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado','domingo'];
var WDCAP=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
var MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var MFULL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var WD=['dom','seg','ter','qua','qui','sex','sáb'];
var LABEL={ok:'Feito',min:'Mínimo viável',skip:'Pulado',fail:'Falhou'};
var JOEL={
  min:['Versão mínima registrada.','O mínimo conta.'],
  skip:['Pulo registrado.'],
  fail:['Registrado. Amanhã é um novo dia.','Anotado. Dá para retomar.'],
  clear:['Desmarcado.']
};

/* ---------- datas (sempre texto AAAA-MM-DD, sem fuso) ---------- */
function p2(n){return (n<10?'0':'')+n}
function todayISO(){var n=new Date();return n.getFullYear()+'-'+p2(n.getMonth()+1)+'-'+p2(n.getDate())}
function dayNum(iso){var m=iso.split('-');return Date.UTC(+m[0],+m[1]-1,+m[2])/86400000}
function isoFromNum(n){var dt=new Date(n*86400000);return dt.getUTCFullYear()+'-'+p2(dt.getUTCMonth()+1)+'-'+p2(dt.getUTCDate())}
function addDays(iso,n){return isoFromNum(dayNum(iso)+n)}
function dow(iso){return (new Date(dayNum(iso)*86400000).getUTCDay()+6)%7}
function dnum(iso){return +iso.split('-')[2]}
function mnum(iso){return +iso.split('-')[1]}
function monday(iso){return addDays(iso,-dow(iso))}
function fmtDL(iso){var m=iso.split('-');return (+m[2])+' '+MS[+m[1]-1]+' '+m[0]}
function fmtDS(iso){var m=iso.split('-');return p2(+m[2])+'/'+p2(+m[1])}
function wday(iso){return WD[new Date(dayNum(iso)*86400000).getUTCDay()]}
function longDate(iso){return WDLONG[dow(iso)]+', '+dnum(iso)+' de '+MFULL[mnum(iso)-1]}
function shortDM(iso){return dnum(iso)+' '+MS[mnum(iso)-1]}
function fmtK(n){return n.toFixed(1).replace('.',',')}
function fmtDelta(n){var r=Math.round(n*10)/10;return (r>0?'+':(r<0?'−':''))+fmtK(Math.abs(r))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

var TODAY=todayISO();
var MINDAY='2026-09-28';           // primeiro dia com registros de exemplo
if(TODAY<MINDAY)MINDAY=TODAY;
var MAXDAY=addDays(TODAY,7);       // até uma semana à frente, só consulta
var MINMONTH='2026-09';

/* ---------- hábitos ---------- */
var H=[
 {id:'treino',name:'Musculação',short:'Musculação',sub:'Push, Pull ou Perna',days:[1,3],bonus:[5],min:'3 exercícios principais, ~30 min',anchor:true},
 {id:'corrida',name:'Corrida',short:'Corrida',sub:'Run/walk, ritmo confortável',days:[0,2,4],min:'Bloco já validado, ritmo confortável',anchor:true},
 {id:'proteina',name:'Proteína no alvo',short:'Proteína',sub:'Meta ≥ 190 g',days:[0,1,2,3,4,5,6],min:'≥ 150 g',anchor:true},
 {id:'planejar',name:'Planejar o fim de semana',short:'Plano de sábado',sub:'Sexta',days:[4],min:'Comida de sábado definida',anchor:true},
 {id:'bolsa',name:'Bolsa pronta',short:'Bolsa pronta',sub:'Noite, para o dia seguinte',days:[0,2,4],min:null,anchor:true},
 {id:'shake',name:'Shake pós-treino',short:'Pós-treino',sub:'Dias de musculação',days:[1,3],min:'Só a proteína'},
 {id:'creatina',name:'Creatina 5 g',short:'Creatina',sub:'Todos os dias',days:[0,1,2,3,4,5,6],min:null},
 {id:'agua',name:'Água',short:'Água',sub:'Meta 2,5 a 3 L',days:[0,1,2,3,4,5,6],min:null},
 {id:'batch',name:'Batch cooking',short:'Batch cooking',sub:'Domingo',days:[6],min:null},
 {id:'pesagem',name:'Pesagem + cintura',short:'Pesagem',sub:'Semanal, segunda',days:[0],min:null},
 {id:'revisao',name:'Revisão semanal',short:'Revisão',sub:'3 perguntas rápidas',days:[6],min:null}
];
function byId(id){for(var i=0;i<H.length;i++)if(H[i].id===id)return H[i]}
function kind(h,iso){if(h.from&&iso<h.from)return null;var d=dow(iso);if(h.days.indexOf(d)>-1)return 'sched';if(h.bonus&&h.bonus.indexOf(d)>-1)return 'bonus';return null}
function itemsFor(iso){return H.filter(function(h){return kind(h,iso)})}

/* ---------- registros: C[data][hábito] = estado (dados de exemplo) ---------- */
var C={
 '2026-09-28':{corrida:'ok',proteina:'ok',creatina:'ok',agua:'ok',bolsa:'ok',pesagem:'ok'},
 '2026-09-29':{treino:'ok',proteina:'ok',shake:'ok',creatina:'ok',agua:'ok'},
 '2026-09-30':{corrida:'fail',proteina:'min',creatina:'ok',agua:'ok',bolsa:'ok'},
 '2026-10-01':{treino:'ok',proteina:'ok',shake:'min',creatina:'ok',agua:'ok'},
 '2026-10-02':{corrida:'ok',proteina:'ok',planejar:'ok',bolsa:'ok',creatina:'ok',agua:'ok'},
 '2026-10-03':{proteina:'ok',creatina:'ok',agua:'ok'},
 '2026-10-04':{proteina:'min',creatina:'ok',agua:'fail',batch:'ok',revisao:'ok'},
 '2026-10-05':{corrida:'ok',proteina:'ok',creatina:'ok',agua:'fail',pesagem:'ok'}   // bolsa ficou sem marcar
};
var R={},N={};
function getS(id,iso){return (C[iso]&&C[iso][id])||null}
function putS(id,iso,st){
  if(!C[iso])C[iso]={};
  if(st)C[iso][id]=st;else delete C[iso][id];
}
// Setembro (dias 1 a 27) só como resumo de exemplo
var HIST='v v a v v f v v v a v v a v v x x v a v v v v v a v v'.split(' ');
var SEEDH={};HIST.forEach(function(s,i){SEEDH['2026-09-'+p2(i+1)]=s});
var seedsOn=true;
var SEEDW={'2026-09-07':85,'2026-09-14':82,'2026-09-21':90};

/* ---------- regras calculadas a partir dos registros ---------- */
function aggDay(iso){
  if(iso>TODAY)return null;
  if(seedsOn&&!C[iso]&&SEEDH[iso])return SEEDH[iso];
  var anchorMiss=false,fail=false,other=false;
  H.forEach(function(h){
    if(kind(h,iso)!=='sched')return;
    var s=getS(h.id,iso);
    if(h.anchor){if(!s)anchorMiss=true;else if(s==='fail')fail=true}
    else if(s==='fail')other=true;
  });
  if(fail)return 'f';
  if(anchorMiss)return iso===TODAY?'pend':'miss';
  return other?'a':'v';
}
function streak(){
  var d=TODAY,s=aggDay(d),n=0,g=0;
  if(s==='pend')d=addDays(d,-1);
  while(g++<200){
    s=aggDay(d);
    if(s==='v'||s==='a')n++;else if(s==='x'){}else break;
    d=addDays(d,-1);
  }
  return n;
}
function stat(h,mon){
  var g=0,t=0;
  for(var i=0;i<7;i++){
    var iso=addDays(mon,i);
    if(iso>TODAY)break;
    var k=kind(h,iso),s=getS(h.id,iso);
    if(k==='sched'){
      if(s==='ok'||s==='min'){g++;t++}
      else if(s==='fail')t++;
      else if(!s&&iso<TODAY)t++;
    }else if(k==='bonus'&&(s==='ok'||s==='min')){g++;t++}
  }
  return {g:g,t:t,pct:t?Math.round(g/t*100):null};
}
function weekPct(mon){
  var g=0,t=0;H.forEach(function(h){var s=stat(h,mon);g+=s.g;t+=s.t});
  return t?Math.round(g/t*100):null;
}
function weekPctFor(mon){
  if(seedsOn&&SEEDW[mon]!==undefined)return SEEDW[mon];
  if(mon<monday(MINDAY))return null;
  return weekPct(mon);
}
function goodWeeks(){
  var m=monday(TODAY),n=0;
  for(var k=1;k<=12;k++){
    var p=weekPctFor(addDays(m,-7*k));
    if(p===null)break;
    if(p>=80)n++;else break;
  }
  return n;
}
function failCount(h,iso){
  var n=0;
  for(var k=1;k<=21;k++){
    var j=addDays(iso,-k);
    if(j<MINDAY)break;
    if(kind(h,j)!=='sched')continue;
    var s=getS(h.id,j);
    if(s==='fail')n++;else if(s==='skip')continue;else break;
  }
  return n;
}
function lastFailDays(h,iso,cnt){
  var out=[];
  for(var k=1;k<=21&&out.length<cnt;k++){
    var j=addDays(iso,-k);
    if(j<MINDAY)break;
    if(kind(h,j)!=='sched')continue;
    var s=getS(h.id,j);
    if(s==='fail')out.unshift(j===addDays(TODAY,-1)?'ontem':WDLONG[dow(j)].split('-')[0]);
    else if(s!=='skip')break;
  }
  return out;
}
function skipsInMonth(iso){
  var pre=iso.slice(0,7),n=0;
  for(var d in C){if(d.slice(0,7)===pre)for(var id in C[d])if(C[d][id]==='skip')n++}
  return n;
}
function bonusCount(iso){
  var pre=iso.slice(0,7),n=0,tot=0,h=byId('treino');
  for(var d in C){
    if(d.slice(0,7)!==pre||dow(d)!==5)continue;
    var s=C[d][h.id];if(s==='ok'||s==='min')n++;
  }
  return n;
}

/* ---------- peso ---------- */
var W=[ // dados de exemplo
 {d:'2026-08-17',kg:94.1,ex:1},{d:'2026-08-24',kg:93.6,ex:1},{d:'2026-08-31',kg:93.0,ex:1},{d:'2026-09-07',kg:92.7,ex:1},
 {d:'2026-09-14',kg:92.1,ex:1},{d:'2026-09-21',kg:91.8,ex:1},{d:'2026-09-28',kg:91.2,ex:1},{d:'2026-10-05',kg:90.9,ex:1}
];
var wDate='',wKg='',wErr='',wDel=null,wEdit=false;
function wSorted(){return W.slice().sort(function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0)})}

/* ---------- estado da tela ---------- */
var hName='',hMin='',hDays=[0,1,2,3,4,5,6],hAnchor=false,hErr='',hInfo=false,hDel=null,cid=0;
var earned={},unseen={},recentNew={},celeQueue=[];

function glyph(st,c){

  if(st==='ok')return '<svg viewBox="0 0 24 24" '+o+' aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  if(st==='min')return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="'+c+'" stroke-width="2.2"/><path d="M12 4.5a7.5 7.5 0 0 0 0 15z" fill="'+c+'"/></svg>';
  if(st==='skip')return '<svg viewBox="0 0 24 24" '+o+' aria-hidden="true"><path d="M6 7l5 5-5 5M13 7l5 5-5 5"/></svg>';
  if(st==='fail')return '<svg viewBox="0 0 24 24" '+o+' aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>';

/* ---------- cabeçalho ---------- */
function relTitle(iso){
  if(iso===TODAY)return 'Hoje';
  if(iso===addDays(TODAY,-1))return 'Ontem';
  if(iso===addDays(TODAY,1))return 'Amanhã';
  return WDCAP[dow(iso)];
}
function ringSvg(done,total){
  var c=2*Math.PI*21,f=total?Math.min(done/total,1):0;
  return '<svg class="ring" viewBox="0 0 52 52" aria-hidden="true"><circle class="rt" cx="26" cy="26" r="21"/>'+(f>0?'<circle class="rf" cx="26" cy="26" r="21" stroke-dasharray="'+(c*f).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 26 26)"/>':'')+'</svg>';
}
function renderTop(){

    var nu=Object.keys(unseen).length;
    h='<div><div class="eyebrow">P27 Check</div><h1>'+relTitle(cur)+'</h1><div class="date">'+longDate(cur)+'</div></div>'+
      '<div class="hr"><div class="prog" role="img" aria-label="'+done+' de '+sched.length+' hábitos checados"><div class="ringbox">'+ringSvg(done,sched.length)+'<div class="pn"><b>'+done+'</b><small>/'+sched.length+'</small></div></div><span class="pl">checados</span></div>'+

  }else if(tab==='semana'){
    var m=monday(cur);

  }else if(tab==='premios'){
    var PP=computePrizes(),nd=PP.filter(function(p){return earned[p.id]}).length;
    h='<div><div class="eyebrow">P27 Check</div><h1>Prêmios</h1><div class="date">'+nd+' de '+PP.length+' conquistados</div></div><button class="navb" data-act="pback">‹ Voltar</button>';

/* ---------- tela Hoje ---------- */
function stripHtml(){
  var m=monday(cur),out='<div class="wk"><button class="arr" data-act="dprev" aria-label="Dia anterior"'+(cur<=MINDAY?' disabled':'')+'>'+ICON_L+'</button><div class="strip" role="group" aria-label="Dias da semana">';
  for(var i=0;i<7;i++){
    var iso=addDays(m,i),a=aggDay(iso),dis=iso<MINDAY||iso>MAXDAY;
    var dot=(a==='pend'||a===null)?'':a;
    out+='<button class="dchip'+(iso===cur?' sel':'')+(iso===TODAY?' tod':'')+'" data-act="goto" data-d="'+iso+'"'+(dis?' disabled':'')+' aria-label="'+longDate(iso)+'"'+(iso===cur?' aria-current="date"':'')+'><small>'+DAYS[i]+'</small><b>'+dnum(iso)+'</b><i class="'+dot+'"></i></button>';
  }
  out+='</div><button class="arr" data-act="dnext" aria-label="Próximo dia"'+(cur>=MAXDAY?' disabled':'')+'>'+ICON_R+'</button></div>';
  if(cur!==TODAY)out+='<div class="back"><button class="tlink" data-act="dtoday">Voltar para hoje</button></div>';
  return out;
}
function habitRow(h,future){
  var k=kind(h,cur),s=getS(h.id,cur),fc=(k==='sched'&&!s&&!future)?failCount(h,cur):0;
  var sub;
  if(s){
    sub=LABEL[s]+(s==='skip'&&R[cur+h.id]?' · '+R[cur+h.id]:'')+(s==='min'&&h.min?' · '+h.min:'');
  }else if(k==='bonus'){sub='Bônus de sábado · opcional'}
  else sub=h.min?'Mínimo · '+h.min:h.sub;
  var tag='';
  if(fc>0)tag='<span class="tag">Retomar · '+fc+(fc>1?' dias':' dia')+'</span>';
  else if(!s&&k==='sched'&&cur<TODAY)tag='<span class="tag soft">Sem registro</span>';
  var pop=lastPop===h.id;
  return '<div class="hrow'+(s==='ok'||s==='min'?' done':'')+(pop?' pop':'')+'">'+
    '<button class="chk'+(s?' s-'+s:'')+(pop&&s?' pop':'')+'" data-act="chk" data-id="'+h.id+'"'+(future?' disabled':'')+' aria-label="'+(s?LABEL[s]+': ':'Marcar ')+esc(h.name)+'">'+(s?glyph(s,gcolor(s)):'')+'</button>'+
    '<div class="info"><div class="hname">'+esc(h.name)+tag+'</div><div class="hsub">'+esc(sub)+'</div></div>'+
    '<button class="more" data-act="sheet" data-id="'+h.id+'"'+(future?' disabled':'')+' aria-label="Outras opções de '+esc(h.name)+'">'+ICON_DOTS+'</button></div>';
}
function alertList(sched){
  var out=[];
  if(cur===TODAY){
    var y=addDays(TODAY,-1);
    if(y>=MINDAY){
      var miss=itemsFor(y).filter(function(h){return kind(h,y)==='sched'&&!getS(h.id,y)});
      if(miss.length)out.push({key:'y',type:'y',title:'Ontem',sub:miss.length+(miss.length>1?' hábitos ficaram sem marcar':' hábito ficou sem marcar'),miss:miss,day:y});
    }
  }
  var rs=[];
  sched.forEach(function(h){if(getS(h.id,cur))return;var fc=failCount(h,cur);if(fc>0)rs.push({h:h,fc:fc})});
  rs.sort(function(a,b){return b.fc-a.fc});
  rs.slice(0,3).forEach(function(r){out.push({key:'r'+r.h.id,type:'r',title:r.h.name,sub:r.fc+(r.fc>1?' dias sem concluir':' dia sem concluir'),h:r.h,fc:r.fc})});
  return out;
}
function alertBody(a){
  if(a.type==='y'){
    return '<p>Falta marcar: '+a.miss.map(function(h){return esc(h.short)}).join(', ')+'.</p><button class="btn" data-act="goto" data-d="'+a.day+'">Completar ontem</button>';
  }
  var nk=cur+a.h.id,t=a.fc>=2?'Um novo dia para retomar.':'Hoje é uma boa oportunidade de retomar.';
  if(a.h.min)t+=' A versão mínima já conta.';
  var out='<p>'+t+'</p>';
  if(a.fc>=2){
    out+=N[nk]?'<div class="saved">Anotado: '+esc(N[nk])+'</div>':
      '<div class="note"><input id="note-'+a.h.id+'" type="text" maxlength="90" placeholder="Se quiser, anote o que atrapalhou" aria-label="O que atrapalhou"><button class="btn" data-act="note" data-id="'+a.h.id+'">Anotar</button></div>';
  }
  return out;
}
function viewHoje(){
  var future=cur>TODAY,items=itemsFor(cur);
  var sched=items.filter(function(h){return kind(h,cur)==='sched'});
  var anchors=sched.filter(function(h){return h.anchor});
  var others=items.filter(function(h){return !(kind(h,cur)==='sched'&&h.anchor)});
  function doneN(list){return list.filter(function(h){var s=getS(h.id,cur);return s==='ok'||s==='min'||s==='skip'}).length}
  var out=stripHtml();
  if(future)out+='<div class="note-f">Dia futuro. Só consulta: os checks abrem no próprio dia.</div>';
  if(!items.length)out+='<div class="note-f">Nenhum hábito planejado para este dia.</div>';
  if(anchors.length){
    var ad=doneN(anchors),win=ad===anchors.length;
    out+='<section class="sec"><div class="sh"><h2>Essenciais</h2><span class="cnt'+(win?' win':'')+'">'+(win?'Dia vitorioso':ad+' de '+anchors.length)+'</span></div>'+
      '<div class="pbar" role="img" aria-label="'+ad+' de '+anchors.length+' essenciais"><i style="width:'+Math.round(ad/anchors.length*100)+'%"></i></div>'+
      '<div class="group">'+anchors.map(function(h){return habitRow(h,future)}).join('')+'</div></section>';
  }
  if(others.length){
    out+='<section class="sec"><div class="sh"><h2>Outros</h2><span class="cnt">'+doneN(others)+' de '+others.length+'</span></div>'+
      '<div class="group">'+others.map(function(h){return habitRow(h,future)}).join('')+'</div></section>';
  }
  if(!future&&items.length)out+='<div class="hint'+(touched?' dim':'')+'">Toque para marcar. Segure para mais opções.</div>';
  if(!future){
    var al=alertList(sched);
    if(al.length){
      var open=alertOpen&&al.some(function(a){return a.key===alertOpen})?alertOpen:al[0].key;
      pendSeen=true;
      out+='<section class="sec"><button type="button" class="sh tg" data-act="pend" aria-expanded="'+(!pendCollapsed)+'"><h2>Pendências</h2><span class="cnt">'+al.length+'</span>'+ICON_CHEV+'</button>';
      if(pendCollapsed){out+='<div class="psum">'+al.map(function(a){return esc(a.title)}).join(' · ')+'</div></section>'}
      else out+='<div class="group">'+
        al.map(function(a){
          var o=a.key===open;
          return '<div class="alert'+(o?' open':'')+'"><button class="ahead" data-act="alert" data-k="'+a.key+'" aria-expanded="'+o+'"><span class="adot'+(a.type==='y'?' y':'')+'"></span><span class="at"><b>'+esc(a.title)+'</b><small>'+esc(a.sub)+'</small></span>'+ICON_CHEV+'</button>'+(o?'<div class="abody">'+alertBody(a)+'</div>':'')+'</div>';
        }).join('')+'</div></section>';
    }
  }
  var wp=weekPct(monday(cur));
  out+='<section class="sec"><div class="sh"><h2>Progresso</h2></div><div class="pstats"><div class="stat"><b>'+streak()+'</b><span>sequência de dias</span></div><div class="stat"><b>'+goodWeeks()+'</b><span>semanas boas</span></div><div class="stat"><b>'+(wp===null?'·':wp+'%')+'</b><span>assiduidade</span></div></div></section>';
  if(!future){
    var rec=W.filter(function(r){return r.d===cur})[0];
    out+='<button class="quick" data-act="topeso"><b>Peso '+(cur===TODAY?'de hoje':'de '+shortDM(cur))+'</b><span class="qv">'+(rec?'<strong>'+fmtK(rec.kg)+'</strong> kg':'Registrar')+ICON_CHEV+'</span></button>';
  }
  var nd=addDays(cur,1),nitems=itemsFor(nd).filter(function(h){return h.days.length<7||kind(h,nd)==='bonus'});
  if(nitems.length&&nd<=MAXDAY){
    out+='<div class="next"><b>'+(nd===addDays(TODAY,1)?'Amanhã':WDCAP[dow(nd)])+'.</b> '+nitems.map(function(h){return kind(h,nd)==='bonus'?h.name+' (bônus, opcional)':h.name}).join(', ')+'.</div>';
  }
  return out;
}

/* ---------- tela Semana ---------- */
function cellFor(h,iso){
  var k=kind(h,iso),s=getS(h.id,iso);
  if(!k)return '<span class="cell none" aria-hidden="true">·</span>';
  if(s)return '<span class="cell s-'+s+'" title="'+LABEL[s]+'" role="img" aria-label="'+LABEL[s]+'">'+glyph(s,gcolor(s))+'</span>';
  if(k==='bonus')return '<span class="cell bonus" title="Bônus de sábado" role="img" aria-label="Bônus de sábado"><b aria-hidden="true">B</b></span>';
  if(iso===TODAY)return '<span class="cell pendt" title="Pendente hoje"></span>';
  if(iso>TODAY)return '<span class="cell fut"></span>';
  return '<span class="cell pend" title="Sem registro"></span>';
}
function viewSemana(){
  var m=monday(cur),wp=weekPct(m),wend=addDays(m,6),out='';
  var wtxt=wp===null?'semana ainda não começou':(wend<TODAY?(wp>=80?'semana concluída, meta atingida':'semana concluída'):'semana em andamento');
  out+='<div class="wknav"><button class="navb" data-act="wprev"'+(m<=monday(MINDAY)?' disabled':'')+'>‹ Anterior</button><span>'+shortDM(m)+' a '+shortDM(wend)+'</span><button class="navb" data-act="wnext"'+(addDays(m,7)>MAXDAY?' disabled':'')+'>Próxima ›</button></div>';
  out+='<section class="card"><div class="big"><b>'+(wp===null?'·':wp+'%')+'</b><span>'+wtxt+'</span></div>'+
    '<div class="track" role="img" aria-label="'+(wp||0)+' por cento, meta em 80 por cento"><div class="fill'+(wp>=80?'':' low')+'" style="width:'+(wp||0)+'%"></div><div class="tick"></div></div>'+
    '<div class="tl"><span>0</span><span>Meta de semana boa · 80%</span><span>100</span></div></section>';
  out+='<section class="card"><div class="gridwrap"><div class="grid" role="table" aria-label="Hábitos por dia"><span></span>';
  for(var d=0;d<7;d++){
    var iso=addDays(m,d),dis=iso<MINDAY||iso>MAXDAY;
    out+='<button class="gh'+(iso===cur?' today':'')+'" data-act="goto" data-d="'+iso+'"'+(dis?' disabled':'')+' aria-label="Abrir '+longDate(iso)+'">'+DAYS[d].charAt(0)+'<em>'+dnum(iso)+'</em></button>';
  }
  out+='<span class="gh">%</span>';
  H.forEach(function(h){
    out+='<span class="gname">'+esc(h.short)+'</span>';
    for(var d2=0;d2<7;d2++)out+=cellFor(h,addDays(m,d2));
    var st=stat(h,m),cls=st.pct===null?'':(st.pct>=80?' good':(st.pct<60?' bad':''));
    out+='<span class="pct'+cls+'">'+(st.pct===null?'·':st.pct+'%')+'</span>';
  });
  out+='</div></div></section>';
  out+='<section class="card"><div class="legend"><span><i class="s-ok"></i>Feito</span><span><i class="s-min"></i>Mínimo</span><span><i class="s-skip"></i>Pulado</span><span><i class="s-fail"></i>Falhou</span><span><i style="border:1.5px dashed var(--pend)"></i>Sem registro</span><span><i style="border:2px solid var(--ivy)"></i>Hoje pendente</span><span><i class="bn">B</i>Bônus de sábado</span></div></section>';
  out+='<section class="card sat"><div><p>Sábado bônus em '+MFULL[mnum(cur)-1]+'</p><b>'+bonusCount(cur)+' de 1</b></div><p style="max-width:180px;text-align:right">Meta mínima do mês. Sem punição se não rolar.</p></section>';
  out+='<div class="hint">Toque em um dia para abrir e corrigir os checks.</div>';
  return out;
}

/* ---------- tela Histórico ---------- */
function viewHist(){
  var y=+hmonth.slice(0,4),mo=+hmonth.slice(5,7);
  var n=new Date(Date.UTC(y,mo,0)).getUTCDate();
  var first=dow(hmonth+'-01');
  var prevOk=hmonth>MINMONTH,nextOk=hmonth<MAXDAY.slice(0,7);
  var out='<div class="mnav"><button data-act="mprev" aria-label="Mês anterior"'+(prevOk?'':' disabled')+'>'+ICON_L+'</button><h2>'+MFULL[mo-1].charAt(0).toUpperCase()+MFULL[mo-1].slice(1)+' '+y+'</h2><button data-act="mnext" aria-label="Próximo mês"'+(nextOk?'':' disabled')+'>'+ICON_R+'</button></div>';
  out+='<section class="card"><div class="cal">';
  DAYS.forEach(function(d){out+='<span class="wd">'+d.charAt(0)+'</span>'});
  var cnt={v:0,a:0,f:0,x:0,miss:0},best=0,run=0,i;
  for(i=0;i<first;i++)out+='<span class="d blank"></span>';
  for(i=1;i<=n;i++){
    var iso=hmonth+'-'+p2(i),s=aggDay(iso);
    var cls=s===null?'fut':s;
    if(cnt[s]!==undefined)cnt[s]++;
    if(s==='v'||s==='a'){run++;if(run>best)best=run}else if(s==='x'){}else if(s!==null&&s!=='pend'){run=0}
    var ring=iso===cur?' cur-ring':'';
    if(iso>=MINDAY&&iso<=MAXDAY)out+='<button class="d '+cls+ring+'" data-act="goto" data-d="'+iso+'" aria-label="Abrir '+longDate(iso)+'">'+i+'</button>';
    else out+='<span class="d '+cls+ring+'">'+i+'</span>';
  }
  out+='</div></section>';
  var tot=cnt.v+cnt.a+cnt.f+cnt.miss;
  out+='<section class="stats mstats"><div class="stat"><b>'+(cnt.v+cnt.a)+'</b><span>vitoriosos de '+tot+'</span></div><div class="stat"><b>'+best+'</b><span>melhor sequência</span></div><div class="stat"><b>'+cnt.x+'</b><span>dias em pausa</span></div></section>';
  out+='<section class="card"><div class="legend sm"><span><i style="background:var(--ivy)"></i>Vitorioso</span><span><i style="background:var(--sage)"></i>Essenciais concluídos</span><span><i style="background:var(--wine)"></i>Essencial não concluído</span><span><i style="background:var(--champ-l);border:1.5px dashed var(--champ)"></i>Sem registro</span><span><i style="background:repeating-linear-gradient(135deg,#D6DDD2 0 3px,#E6EBE2 3px 6px)"></i>Pausa</span><span><i style="border:1.5px solid var(--ivy)"></i>Em aberto</span></div></section>';
  out+='<div class="hint">Toque em um dia a partir de 28 set para abrir e corrigir.</div>';
  return out;
}

/* ---------- tela Peso ---------- */
function chartSvg(a){
  var VW=340,VH=190,L=36,R=14,T=22,B=26,iw=VW-L-R,ih=VH-T-B,i;
  var mn=Infinity,mx=-Infinity;a.forEach(function(r){if(r.kg<mn)mn=r.kg;if(r.kg>mx)mx=r.kg});
  var lo=Math.floor(mn-0.4),hi=Math.ceil(mx+0.4);if(hi-lo<2)hi=lo+2;
  var step=(hi-lo)<=6?1:2;hi=lo+Math.ceil((hi-lo)/step)*step;
  var t0=dayNum(a[0].d),t1=dayNum(a[a.length-1].d);
  function X(r){return a.length===1||t1===t0?L+iw/2:L+(dayNum(r.d)-t0)/(t1-t0)*iw}
  function Y(k){return T+(hi-k)/(hi-lo)*ih}
  var s='<svg class="chart" viewBox="0 0 '+VW+' '+VH+'" role="img" aria-label="Gráfico de peso de '+fmtDS(a[0].d)+' a '+fmtDS(a[a.length-1].d)+', último registro '+fmtK(a[a.length-1].kg)+' quilos">';
  for(var k=lo;k<=hi;k+=step){
    s+='<line class="gl" x1="'+L+'" x2="'+(VW-R)+'" y1="'+Y(k).toFixed(1)+'" y2="'+Y(k).toFixed(1)+'"/>'+
       '<text class="ax" x="'+(L-6)+'" y="'+(Y(k)+3.5).toFixed(1)+'" text-anchor="end">'+k+'</text>';
  }
  var pts=a.map(function(r){return X(r).toFixed(1)+','+Y(r.kg).toFixed(1)});
  if(a.length>1){
    s+='<path class="ar" d="M'+pts.join(' L')+' L'+X(a[a.length-1]).toFixed(1)+','+(T+ih)+' L'+X(a[0]).toFixed(1)+','+(T+ih)+' Z"/>';
    s+='<path class="ln" d="M'+pts.join(' L')+'"/>';
  }
  a.forEach(function(r,j){if(j<a.length-1)s+='<circle class="pt" cx="'+X(r).toFixed(1)+'" cy="'+Y(r.kg).toFixed(1)+'" r="3.2"/>'});

  var S={},dates=allDates(SCAN_START,TODAY),run=0,best=0,prev=null;
  S.runAt={};S.firstVict=null;S.comeback=null;S.minSaved=null;
  dates.forEach(function(iso){
    var a=aggDay(iso);
    if(a==='v'||a==='a'){
      run++;if(run>best)best=run;if(!S.runAt[run])S.runAt[run]=iso;if(!S.firstVict)S.firstVict=iso;
      if(prev==='f'&&!S.comeback)S.comeback=iso;
      if(C[iso]&&!S.minSaved&&itemsFor(iso).some(function(h){return kind(h,iso)==='sched'&&h.anchor&&getS(h.id,iso)==='min'}))S.minSaved=iso;
    }else if(a==='x'||a==='pend'){}
    else run=0;
    if(a!=='pend'&&a!==null)prev=a;
  });
  S.bestRun=best;
  S.perfect=[];S.checks=[];S.corr=[];S.trein=[];S.mins=[];S.bonusSat=null;
  Object.keys(C).sort().forEach(function(iso){
    if(iso>TODAY)return;
    var items=itemsFor(iso),sched=items.filter(function(h){return kind(h,iso)==='sched'}),all=sched.length>0;
    items.forEach(function(h){
      var s=getS(h.id,iso),k=kind(h,iso);
      if(doneOk(s)){
        S.checks.push(iso);
        if(h.id==='corrida')S.corr.push(iso);
        if(h.id==='treino')S.trein.push(iso);
        if(s==='min')S.mins.push(iso);
        if(h.id==='treino'&&k==='bonus'&&!S.bonusSat)S.bonusSat=iso;
      }
      if(k==='sched'&&!doneOk(s))all=false;
    });
    if(all)S.perfect.push(iso);
  });
  var pr=0;S.protAt={};S.protBest=0;
  allDates(MINDAY,TODAY).forEach(function(iso){
    var s=getS('proteina',iso);

    else if(!(iso===TODAY&&!s))pr=0;

  var grun=0,mon=monday('2026-09-07'),i;
  for(;addDays(mon,6)<=TODAY;mon=addDays(mon,7)){
    var sun=addDays(mon,6),p=weekPctFor(mon);

      if(p>S.bestWeekPct)S.bestWeekPct=p;
      if(p>=80){if(!S.goodFirst)S.goodFirst=sun;grun++;if(grun>S.bestGoodRun)S.bestGoodRun=grun;if(!S.goodRunAt[grun])S.goodRunAt[grun]=sun}

}

  var near=P.filter(function(p){return !earned[p.id]&&p.goal>1&&p.cur>0}).sort(function(a,b){return b.cur/b.goal-a.cur/a.goal}).slice(0,3);

    full:sched.length>0&&sched.every(function(h){return doneOk(getS(h.id,iso))})

function importJSON(txt){
  var d;try{d=JSON.parse(txt)}catch(e){return 'Arquivo ou texto inválido.'}
  if(!d||d.app!=='p27-check'||!Array.isArray(d.H)||!d.C||typeof d.C!=='object'||!Array.isArray(d.W))return 'Este conteúdo não parece ser do P27 Check.';
  for(var i=0;i<d.H.length;i++){var h=d.H[i];if(!h||typeof h.id!=='string'||typeof h.name!=='string'||!Array.isArray(h.days))return 'Lista de hábitos inconsistente.'}
  for(var j=0;j<d.W.length;j++){if(!d.W[j]||typeof d.W[j].d!=='string'||typeof d.W[j].kg!=='number')return 'Registros de peso inconsistentes.'}
  H=d.H;C=d.C;R=d.R||{};N=d.N||{};W=d.W;seedsOn=d.seeds===true;
  earned={};unseen={};recentNew={};celeQueue=[];
  initEarned();
  return '';
}
function doDownload(){
  var fname='p27-check-'+TODAY+'.json';
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(d){
      if(!d){toastText('Download indisponível aqui. Use Copiar como texto.');return}
      d.save({filename:fname,data:exportJSON()}).then(function(){closeSheet();toastText('Arquivo salvo.')},function(er){if(er&&er.code!=='declined')toastText('Não deu para baixar. Use Copiar como texto.')});
    },function(){toastText('Download indisponível aqui. Use Copiar como texto.')});
    return;
  }
  try{
    var blob=new Blob([exportJSON()],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=fname;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
    closeSheet();toastText('Arquivo gerado.');
  }catch(e){toastText('Não deu para baixar. Use Copiar como texto.')}
}
function doCopy(){
  var t=exportJSON();
  function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);closeSheet();toastText(ok?'Texto copiado.':'Não foi possível copiar.')}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){closeSheet();toastText('Texto copiado.')},fb);else fb();
}

view.addEventListener('submit',function(e){
  if(e.target.id==='hform'){

    var nh={id:'c'+(++cid),name:nm,short:nm,days:hDays.slice().sort(),min:mn||null,anchor:hAnchor,from:TODAY,custom:true};
    nh.sub=daysSummary(nh.days);

    hName='';hMin='';hDays=[0,1,2,3,4,5,6];hAnchor=false;hErr='';

  }

  var dEl=document.getElementById('w-date');

  render();
  afterChange();
});

  else if(a==='dwipeok'){wipeData();closeSheet();tab='hoje';cur=TODAY;hmonth=TODAY.slice(0,7);document.getElementById('view').scrollTop=0;render();toastText('Dados apagados.')}
  else if(a==='dexpfile'){doDownload()}
  else if(a==='dexpcopy'){doCopy()}
  else if(a==='dpick'){var fi=document.getElementById('imp-file');if(fi)fi.click()}
  else if(a==='dimpgo'){
    var ta=document.getElementById('imp-txt'),er=importJSON(ta?ta.value:'');
    if(er){var e2=document.getElementById('imp-err');if(e2)e2.textContent=er}
    else{closeSheet();tab='hoje';cur=TODAY;hmonth=TODAY.slice(0,7);document.getElementById('view').scrollTop=0;render();toastText('Dados importados.')}
  }
  else if(a==='hdelask'){hConfirm=true;renderHabitSheet()}
  else if(a==='hdelok'){
    var hid=hSheetId;
    H=H.filter(function(h){return h.id!==hid});
    for(var dk in C)delete C[dk][hid];
    closeSheet();toastText('Hábito excluído.');render();
  }
});
document.getElementById('sheet').addEventListener('change',function(e){
  if(e.target.id!=='imp-file'||!e.target.files||!e.target.files[0])return;
  var fr=new FileReader();fr.onload=function(){var ta=document.getElementById('imp-txt');if(ta){ta.value=String(fr.result||'');var er=document.getElementById('imp-err');if(er)er.textContent=''}};
  fr.readAsText(e.target.files[0]);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('sheet').hidden)closeSheet()});
document.querySelector('.tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-tab]');if(!b)return;
  if(tab==='hoje'&&pendSeen)pendCollapsed=true;
  tab=b.getAttribute('data-tab');wErr='';wEdit=false;wDel=null;wMenu=null;
  if(tab==='hist')hmonth=cur.slice(0,7);
  document.getElementById('view').scrollTop=0;render();
});
initEarned();
render();
})();

</script>
</body>
</html>
